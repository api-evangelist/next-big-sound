name: Next Big Sound
description: >-
  Next Big Sound was a music-industry analytics company founded in 2009 out of
  Techstars Boulder that tracked artists' social, streaming, and airplay signals
  (plays, fans, engagement across Spotify, YouTube, SoundCloud, radio and social
  platforms) and exposed them through a REST developer API used by labels,
  managers and media. It was backed by Foundry Group, Uncork Capital (SoftTech
  VC), Alsop Louie and IA Ventures, and was acquired by Pandora in August 2015.
  Its analytics became Pandora's artist tools and were folded into the Pandora /
  SiriusXM Artist Marketing Platform (AMP). The standalone developer API and
  portal (developer.nextbigsound.com) have been deprecated; nextbigsound.com now
  resolves to Pandora infrastructure and HTTP redirects to amp.pandora.com. This
  profile is retained as a network identity record for a defunct/acquired
  provider — no independent live API surface remains to harvest.
